name: Consumer smoke checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consumer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dependency: [source, published]
        variant: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build consumer
        shell: bash
        env:
          CONSUMER_DEPENDENCY: ${{ matrix.dependency }}
          CONSUMER_VARIANT: ${{ matrix.variant }}
        run: |
          bash ./gradlew \
            -I scripts/consumer-smoke.init.gradle \
            -PconsumerDependency="$CONSUMER_DEPENDENCY" \
            ":SnapNotifyDemo:assemble${CONSUMER_VARIANT}" \
            --stacktrace
      - name: Upload release shrinking diagnostics
        if: always() && matrix.variant == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-${{ matrix.dependency }}-${{ matrix.variant }}
          path: SnapNotifyDemo/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 14
